<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        /* REMOVE ALL PAGE MARGINS AND SCROLLBARS */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        /* VIDEO FITS INSIDE THE FRAME */
        #videoPlayer {
            display: block;
            width: 100%;
            height: 100vh;

            /* Show entire video without cropping */
            object-fit: cover;

            margin: 0;
            padding: 0;
            border: 0;
        }
    </style>
</head>

<body>

    <!-- VIDEO PLAYER -->
    <video
        id="videoPlayer"
        autoplay
        muted
        playsinline
        preload="auto">
    </video>

    <script>
        const owner = "itallied143";
        const repo = "Allied-DCI";
        const folder = "Video";

        const player = document.getElementById("videoPlayer");

        async function loadVideos() {
            try {

                const response = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
                );

                if (!response.ok) {
                    throw new Error("Could not load video folder");
                }

                const files = await response.json();

                const videos = files
                    .filter(file =>
                        file.name.toLowerCase().endsWith(".mp4")
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    )
                    .map(file => file.download_url);

                if (videos.length === 0) {
                    console.log("No videos found.");
                    return;
                }

                let currentVideo = 0;

                function playVideo() {

                    player.src = videos[currentVideo];

                    player.play().catch(error => {
                        console.log("Autoplay blocked:", error);
                    });
                }

                /* PLAY NEXT VIDEO */
                player.addEventListener("ended", () => {

                    currentVideo++;

                    /* AFTER LAST VIDEO, START AGAIN */
                    if (currentVideo >= videos.length) {
                        currentVideo = 0;
                    }

                    playVideo();
                });

                /* START PLAYING */
                playVideo();

            } catch (error) {
                console.error("Video error:", error);
            }
        }

        loadVideos();
    </script>

</body>
</html>
