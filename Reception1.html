<!-- VIDEO PLAYER -->
<video
    id="videoPlayer"
    autoplay
    muted
    playsinline
    preload="auto">
</video>

<!-- VIDEO SIZE / RESOLUTION -->
<style>
#videoPlayer {
    html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
}
</style>

<script>
const owner = "itallied143";
const repo = "Allied-DCI";
const folder = "Video";

const player = document.getElementById("videoPlayer");

async function loadVideos() {
    try {
        const response = await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
        );

        if (!response.ok) {
            throw new Error("Could not load video folder");
        }

        const files = await response.json();

        const videos = files
            .filter(file =>
                file.name.toLowerCase().endsWith(".mp4")
            )
            .sort((a, b) =>
                a.name.localeCompare(b.name)
            )
            .map(file => file.download_url);

        if (videos.length === 0) {
            console.log("No videos found.");
            return;
        }

        let currentVideo = 0;

        function playVideo() {
            player.src = videos[currentVideo];

            player.play().catch(error => {
                console.log("Autoplay blocked:", error);
            });
        }

        // When video finishes → play next video
        player.addEventListener("ended", () => {

            currentVideo++;

            // After last video → start again
            if (currentVideo >= videos.length) {
                currentVideo = 0;
            }

            playVideo();
        });

        // Start first video
        playVideo();

    } catch (error) {
        console.error("Video error:", error);
    }
}

loadVideos();
</script>
