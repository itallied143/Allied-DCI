<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* =========================================
           PAGE
        ========================================= */

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================
           VIDEO
        ========================================= */

        #videoPlayer {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            object-position: center center;
            margin: 0;
            padding: 0;
            border: 0;
            z-index: 1;
        }


        /* =========================================
           COMBINED TOP INFORMATION BANNER
        ========================================= */

        #topBanner {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            min-height: 0;
            padding: 6px 14px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;

            background: rgba(8, 18, 32, 0.60);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(0, 217, 255, 0.30);
            border-radius: 18px;

            color: white;
            z-index: 9999;

            box-shadow:
                0 0 30px rgba(0, 180, 255, 0.16),
                0 8px 30px rgba(0, 0, 0, 0.40);

            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        #topBanner.hudHidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .topSection {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .timeSection {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

.topDivider {
            width: 1px;
            height: 45px;
            background: rgba(0, 217, 255, 0.25);
            flex-shrink: 0;
        }

        .sectionLabel {
            font-size: 8px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00d9ff;
            white-space: nowrap;
        }

        .liveDot {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin: 0 4px 1px 5px;
            border-radius: 50%;
            background: #00eaff;
            box-shadow: 0 0 8px #00eaff;
        }

        #clock {
            display: flex;
            align-items: baseline;
            margin-top: 2px;
            font-size: 23px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: 2px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.18);
        }

        #clockHour,
        #clockMinute,
        #clockSecond {
            display: inline-block;
            width: 33px;
            text-align: center;
            flex-shrink: 0;
        }

        .clockColon {
            display: inline-block;
            width: 9px;
            text-align: center;
        }

        #clockPeriod {
            display: inline-block;
            width: 30px;
            margin-left: 5px;
            text-align: left;
            font-size: 0.45em;
            letter-spacing: 1px;
        }

        #date {
            margin-top: 3px;
            font-size: 8px;
            color: rgba(255,255,255,0.65);
            white-space: nowrap;
        }






to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-width: 800px) {
            #topBanner {
                top: 8px;
                width: auto;
                min-height: 0;
                padding: 5px 10px;
                gap: 8px;
                border-radius: 13px;
            }

            .topDivider {
                height: 48px;
            }

            .sectionLabel {
                font-size: 7px;
                letter-spacing: 1px;
            }

            #clock {
                font-size: 23px;
                letter-spacing: 1px;
            }

            #clockHour,
            #clockMinute,
            #clockSecond {
                width: 29px;
            }

            .clockColon {
                width: 7px;
            }

            #clockPeriod {
                width: 28px;
                margin-left: 3px;
            }

            #date {
                font-size: 8px;
            }
}

    </style>

</head>


<body>


    <!-- =========================================
         VIDEO PLAYER
    ========================================= -->

    <video
        id="videoPlayer"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        src="http://192.168.0.117/video/ADCVideo.mp4">
    </video>



    <!-- =========================================
         COMBINED TOP INFORMATION BANNER
    ========================================= -->

    <div id="topBanner">

        <div class="topSection timeSection">
            <div class="sectionLabel">ABU DHABI <span class="liveDot"></span> LIVE</div>
            <div id="clock">
                <span id="clockHour">00</span><span class="clockColon">:</span><span id="clockMinute">00</span><span class="clockColon">:</span><span id="clockSecond">00</span>
                <span id="clockPeriod">PM</span>
            </div>
            <div id="date">Loading date...</div>
        </div>

    </div>
</div>


    <script>
        /* =========================================
           LOCAL NETWORK VIDEO PLAYER
           Auto-play + continuous repeat
        ========================================= */

        const player = document.getElementById("videoPlayer");

        const localVideo =
            "http://192.168.0.117/video/ADCVideo.mp4";

        player.src = localVideo;
        player.loop = true;
        player.muted = true;
        player.autoplay = true;
        player.playsInline = true;

        /* Keep HUD visible when the video starts */
        player.addEventListener("play", () => {
            if (typeof showHud === "function") {
                showHud();
            }
        });

        /* Attempt autoplay when the page loads */
        window.addEventListener("load", () => {
            player.play().catch(error => {
                console.log("Autoplay blocked:", error);
            });
        });


        /* =========================================
           CLOCK
        ========================================= */

        function updateClock() {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit",

                        hour12:
                            true
                    }
                );


            const date =
                now.toLocaleDateString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            const timeParts = time.split(" ");

            const clockParts = timeParts[0].split(":");

            document.getElementById(
                "clockHour"
            ).textContent = clockParts[0];

            document.getElementById(
                "clockMinute"
            ).textContent = clockParts[1];

            document.getElementById(
                "clockSecond"
            ).textContent = clockParts[2];

            document.getElementById(
                "clockPeriod"
            ).textContent = timeParts[1] || "";


            document.getElementById(
                "date"
            ).textContent = date;

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );
</script>


</body>
</html>
