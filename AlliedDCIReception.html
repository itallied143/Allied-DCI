<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* =========================================
           PAGE
        ========================================= */

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================
           VIDEO
        ========================================= */

        #videoPlayer {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            object-position: center center;
            margin: 0;
            padding: 0;
            border: 0;
            z-index: 1;
        }


        /* =========================================
           MODERN TIME / WEATHER HUD
        ========================================= */

        #infoPanel {

            position: fixed;

            left: 35px;

            /* LOWER LEFT */
            bottom: 95px;

            width: 285px;

            padding: 22px 25px;

            background: rgba(8, 18, 32, 0.52);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(0, 217, 255, 0.30);

            border-radius: 18px;

            color: white;

            z-index: 10;

            box-sizing: border-box;

            box-shadow:
                0 8px 35px rgba(0, 0, 0, 0.30),
                inset 0 0 25px rgba(0, 200, 255, 0.04);
        }


        /* SMALL TOP LABEL */

        .panelHeader {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 8px;
        }


        #location {

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 3px;

            color: #00d9ff;

            text-transform: uppercase;
        }


        #liveIndicator {

            display: flex;

            align-items: center;

            gap: 6px;

            font-size: 9px;

            letter-spacing: 1px;

            color: rgba(255,255,255,0.65);

            text-transform: uppercase;
        }


        #liveDot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background: #00eaff;

            box-shadow:
                0 0 8px #00eaff;
        }


        /* =========================================
           CLOCK
        ========================================= */

        #clock {

            display: flex;

            align-items: baseline;

            justify-content: flex-start;

            font-size: 40px;

            font-weight: 300;

            line-height: 1;

            letter-spacing: 3px;

            color: #ffffff;

            margin-top: 5px;

            white-space: nowrap;

            font-variant-numeric: tabular-nums;

            font-feature-settings: "tnum";

            text-shadow:
                0 0 15px rgba(0, 217, 255, 0.18);
        }

        #clockHour,
        #clockMinute,
        #clockSecond {

            display: inline-block;

            width: 52px;

            text-align: center;

            flex-shrink: 0;
        }

        .clockColon {

            display: inline-block;

            width: 18px;

            text-align: center;

            flex-shrink: 0;
        }

        #clockPeriod {

            display: inline-block;

            width: 42px;

            margin-left: 8px;

            text-align: left;

            font-size: 0.55em;

            letter-spacing: 1px;

            flex-shrink: 0;
        }


        /* =========================================
           DATE
        ========================================= */

        #date {

            font-size: 13px;

            margin-top: 9px;

            color: rgba(255,255,255,0.68);

            letter-spacing: 0.5px;
        }


        /* =========================================
           ACCENT LINE
        ========================================= */

        .accentLine {

            width: 100%;

            height: 1px;

            margin: 17px 0;

            background:
                linear-gradient(
                    90deg,
                    #00d9ff,
                    rgba(0,217,255,0.15),
                    transparent
                );
        }


        /* =========================================
           WEATHER SECTION
        ========================================= */

        .weatherRow {

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* WEATHER ICON */

        #weatherIcon {

            font-size: 38px;

            line-height: 1;

            margin-right: 14px;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(0,217,255,0.20)
                );
        }


        /* TEMPERATURE */

        #temperature {

            font-size: 40px;

            font-weight: 300;

            line-height: 1;

            color: #00d9ff;

            white-space: nowrap;
        }


        .temperatureLabel {

            font-size: 10px;

            color: rgba(255,255,255,0.50);

            letter-spacing: 2px;

            margin-top: 5px;

            text-transform: uppercase;
        }


        /* WEATHER DETAILS */

        .weatherDetails {

            text-align: right;

            margin-left: auto;
        }


        #condition {

            font-size: 13px;

            color: white;

            margin-bottom: 6px;
        }


        #humidity {

            font-size: 11px;

            color: rgba(255,255,255,0.55);
        }


        /* =========================================
           BOTTOM CENTER BAR
        ========================================= */

        #bottomBar {
            position: fixed;
            left: 50%;
            top: 12px;
            transform: translateX(-50%);
            width: max-content;
            padding: 9px 16px;
            background: rgba(8, 18, 32, 0.52);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 217, 255, 0.30);
            border-radius: 18px;
            color: white;
            text-align: center;

            /* VERY FRONT - ABOVE VIDEO AND OTHER CONTENT */
            z-index: 9999;

            box-shadow:
                0 0 30px rgba(0, 180, 255, 0.20),
                0 8px 30px rgba(0, 0, 0, 0.45);

            box-sizing: border-box;
        }


        .barContent {
            font-size: 12px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .barTitle {
            color: #00d9ff;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .barDivider {
            margin: 0 7px;
            color: rgba(255,255,255,0.35);
        }

        .currencyRates {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-left: 8px;
        }

        .rateItem {
            color: white;
            padding: 4px 7px;
            border: 1px solid rgba(0, 217, 255, 0.18);
            border-radius: 5px;
            background: rgba(0, 217, 255, 0.05);
        }

        .rateItem strong {
            color: #00d9ff;
            font-weight: bold;
        }

        .rateValue {
            color: #ffffff;
            margin-left: 3px;
        }

        /* SINGLE CURRENCY ROTATION */
        .currencyViewport {
            display: inline-flex;
            vertical-align: middle;
            align-items: center;
            justify-content: center;
            width: 205px;
            height: 28px;
            overflow: hidden;
            text-align: center;
            flex-shrink: 0;
            position: relative;
        }

        .currencyItem {
            display: none;
            color: white;
            white-space: nowrap;
            animation: currencyFade 0.7s ease;
            width: 100%;
            text-align: center;
        }

        .currencyItem.active {
            display: block;
        }

        .currencyItem strong {
            color: #00d9ff;
        }

        @keyframes currencyFade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
            to {
                transform: translateX(-50%);
            }
        }


        .barLine {

            height: 1px;

            width: 45px;

            margin: 0 auto 6px auto;

            background: #00d9ff;
        }


        .barLine:last-child {

            margin: 6px auto 0 auto;
        }


        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-width: 700px) {

            #infoPanel {

                left: 15px;

                bottom: 80px;

                width: 240px;

                padding: 18px 20px;

                border-radius: 14px;
            }


            #clock {

                font-size: 32px;
            }

            #clockTime {

                width: 150px;
            }

            #clockPeriod {

                width: 34px;

                margin-left: 5px;
            }


            #temperature {

                font-size: 32px;
            }


            #weatherIcon {

                font-size: 30px;
            }


            #bottomBar {
                bottom: 5cm;
                width: fit-content;
                padding: 8px 10px;
            }

            .barContent {
                font-size: 8px;
                letter-spacing: 0.4px;
            }

            .currencyViewport {
                width: 190px;
                height: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         VIDEO PLAYER
    ========================================= -->

    <video
        id="videoPlayer"
        autoplay
        muted
        playsinline
        preload="auto">
    </video>



    <!-- =========================================
         MODERN TIME + WEATHER PANEL
    ========================================= -->

    <div id="infoPanel">

        <div class="panelHeader">

            <div id="location">
                ABU DHABI
            </div>

            <div id="liveIndicator">

                <span id="liveDot"></span>

                LIVE

            </div>

        </div>


        <div id="clock">
            <span id="clockHour">00</span>
            <span class="clockColon">:</span>
            <span id="clockMinute">00</span>
            <span class="clockColon">:</span>
            <span id="clockSecond">00</span>
            <span id="clockPeriod">PM</span>
        </div>


        <div id="date">
            Loading date...
        </div>


        <div class="accentLine"></div>


        <div class="weatherRow">

            <div id="weatherIcon">
                ☀️
            </div>


            <div>

                <div id="temperature">
                    --°C
                </div>

                <div class="temperatureLabel">
                    Temperature
                </div>

            </div>


            <div class="weatherDetails">

                <div id="condition">
                    Loading...
                </div>

                <div id="humidity">
                    Humidity: --%
                </div>

            </div>

        </div>

    </div>



    <!-- =========================================
         BOTTOM CENTER ADC BAR
    ========================================= -->

    <div id="bottomBar">

        <div class="barLine"></div>

        <div class="barContent">

            <span class="barTitle">
                CURRENCY EXCHANGE
            </span>

            <span class="barDivider">|</span>

            <span class="currencyViewport">

                <span class="currencyItem active" data-currency="PHP">
                    🇵🇭 PHP <strong>1 AED =</strong> <span id="phpRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="INR">
                    🇮🇳 INR <strong>1 AED =</strong> <span id="inrRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="RSD">
                    🇷🇸 RSD <strong>1 AED =</strong> <span id="rsdRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="JOD">
                    🇯🇴 JOD <strong>1 AED =</strong> <span id="jodRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="EGP">
                    🇪🇬 EGP <strong>1 AED =</strong> <span id="egpRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="MAD">
                    🇲🇦 MAD <strong>1 AED =</strong> <span id="madRate" class="rateValue">--</span>
                </span>

            </span>

        </div>

        <div class="barLine"></div>

    </div>



    <script>


        /* =========================================
           VIDEO PLAYLIST
        ========================================= */

        const owner = "itallied143";

        const repo = "Allied-DCI";

        const folder = "Video";

        const player =
            document.getElementById("videoPlayer");


        async function loadVideos() {

            try {

                const response = await fetch(

                    `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`

                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load video folder"
                    );

                }


                const files =
                    await response.json();


                const videos = files

                    .filter(file =>
                        file.name
                            .toLowerCase()
                            .endsWith(".mp4")
                    )

                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    )

                    .map(file =>
                        file.download_url
                    );


                if (videos.length === 0) {

                    console.log(
                        "No videos found."
                    );

                    return;
                }


                let currentVideo = 0;


                function playVideo() {

                    player.src =
                        videos[currentVideo];


                    player.play()
                        .catch(error => {

                            console.log(
                                "Autoplay blocked:",
                                error
                            );

                        });

                }


                player.addEventListener(
                    "ended",
                    () => {

                        currentVideo++;

                        if (
                            currentVideo >=
                            videos.length
                        ) {

                            currentVideo = 0;

                        }

                        playVideo();

                    }
                );


                playVideo();


            } catch (error) {

                console.error(
                    "Video error:",
                    error
                );

            }

        }


        loadVideos();



        /* =========================================
           CLOCK
        ========================================= */

        function updateClock() {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit",

                        hour12:
                            true
                    }
                );


            const date =
                now.toLocaleDateString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            const timeParts = time.split(" ");

            const clockParts = timeParts[0].split(":");

            document.getElementById(
                "clockHour"
            ).textContent = clockParts[0];

            document.getElementById(
                "clockMinute"
            ).textContent = clockParts[1];

            document.getElementById(
                "clockSecond"
            ).textContent = clockParts[2];

            document.getElementById(
                "clockPeriod"
            ).textContent = timeParts[1] || "";


            document.getElementById(
                "date"
            ).textContent = date;

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );



        /* =========================================
           WEATHER
           ABU DHABI
        ========================================= */

        async function loadWeather() {

            try {

                const response =
                    await fetch(

                        "https://api.open-meteo.com/v1/forecast?latitude=24.4539&longitude=54.3773&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FDubai"

                    );


                if (!response.ok) {

                    throw new Error(
                        "Weather unavailable"
                    );

                }


                const data =
                    await response.json();


                const current =
                    data.current;


                /* TEMPERATURE */

                document.getElementById(
                    "temperature"
                ).textContent =

                    Math.round(
                        current.temperature_2m
                    ) + "°C";


                /* HUMIDITY */

                document.getElementById(
                    "humidity"
                ).textContent =

                    "Humidity: " +

                    Math.round(
                        current.relative_humidity_2m
                    ) +

                    "%";


                /* WEATHER CONDITION */

                const weatherCode =
                    current.weather_code;


                let condition =
                    "Clear Sky";

                let icon =
                    "☀️";


                if (weatherCode === 0) {

                    condition =
                        "Clear Sky";

                    icon =
                        "☀️";

                }

                else if (
                    weatherCode === 1 ||
                    weatherCode === 2
                ) {

                    condition =
                        "Partly Cloudy";

                    icon =
                        "🌤️";

                }

                else if (
                    weatherCode === 3
                ) {

                    condition =
                        "Cloudy";

                    icon =
                        "☁️";

                }

                else if (
                    weatherCode >= 45 &&
                    weatherCode <= 48
                ) {

                    condition =
                        "Foggy";

                    icon =
                        "🌫️";

                }

                else if (
                    weatherCode >= 51 &&
                    weatherCode <= 67
                ) {

                    condition =
                        "Rain";

                    icon =
                        "🌧️";

                }

                else if (
                    weatherCode >= 80 &&
                    weatherCode <= 82
                ) {

                    condition =
                        "Rain Showers";

                    icon =
                        "🌦️";

                }

                else if (
                    weatherCode >= 95
                ) {

                    condition =
                        "Thunderstorm";

                    icon =
                        "⛈️";

                }


                document.getElementById(
                    "condition"
                ).textContent =
                    condition;


                document.getElementById(
                    "weatherIcon"
                ).textContent =
                    icon;


            }

            catch (error) {

                console.log(
                    "Weather error:",
                    error
                );


                document.getElementById(
                    "condition"
                ).textContent =
                    "Weather unavailable";

            }

        }


        /* INITIAL WEATHER */

        loadWeather();


        /* REFRESH EVERY 10 MINUTES */

        setInterval(
            loadWeather,
            600000
        );



        /* =========================================
           LIVE AED CURRENCY EXCHANGE
           PHP = Philippine Peso
           INR = Indian Rupee
           RSD = Serbian Dinar
           JOD = Jordanian Dinar
           EGP = Egyptian Pound
           MAD = Moroccan Dirham
        ========================================= */

        async function loadCurrencyRates() {

            try {

                const response = await fetch(
                    "https://open.er-api.com/v6/latest/AED"
                );

                if (!response.ok) {
                    throw new Error("Currency rates unavailable");
                }

                const data = await response.json();
                const rates = data.rates;

                document.getElementById("phpRate").textContent =
                    rates.PHP ? rates.PHP.toFixed(2) : "--";

                document.getElementById("inrRate").textContent =
                    rates.INR ? rates.INR.toFixed(2) : "--";

                document.getElementById("rsdRate").textContent =
                    rates.RSD ? rates.RSD.toFixed(2) : "--";

                document.getElementById("jodRate").textContent =
                    rates.JOD ? rates.JOD.toFixed(2) : "--";

                document.getElementById("egpRate").textContent =
                    rates.EGP ? rates.EGP.toFixed(2) : "--";

                document.getElementById("madRate").textContent =
                    rates.MAD ? rates.MAD.toFixed(2) : "--";


            } catch (error) {

                console.log("Currency error:", error);

            }

        }

        loadCurrencyRates();

        /* Refresh exchange rates every 30 minutes */
        setInterval(
            loadCurrencyRates,
            1800000
        );


        /* =========================================
           CHANGE CURRENCY EVERY 4 SECONDS
        ========================================= */

        const currencyItems =
            document.querySelectorAll(".currencyItem");

        let currencyIndex = 0;

        function rotateCurrency() {

            currencyItems.forEach(item =>
                item.classList.remove("active")
            );

            currencyIndex++;

            if (currencyIndex >= currencyItems.length) {
                currencyIndex = 0;
            }

            currencyItems[currencyIndex]
                .classList.add("active");
        }

        setInterval(
            rotateCurrency,
            4000
        );

    </script>


</body>
</html>
