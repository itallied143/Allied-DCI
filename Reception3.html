<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* =========================================
           PAGE
        ========================================= */

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================
           VIDEO
        ========================================= */

        #videoPlayer {
            display: block;

            width: 100%;
            height: 100vh;

            object-fit: contain;

            margin: 0;
            padding: 0;
            border: 0;
        }


        /* =========================================
           LEFT TIME + WEATHER PANEL
        ========================================= */

        #infoPanel {

            position: fixed;

            left: 35px;

            /* MOVED LOWER */
            top: 58%;

            transform: translateY(-50%);

            width: 260px;

            padding: 25px 28px;

            background: rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-left: 4px solid #00d9ff;

            border-radius: 0 15px 15px 0;

            color: white;

            z-index: 10;

            box-sizing: border-box;
        }


        /* LOCATION */

        #location {

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 3px;

            color: #00d9ff;

            margin-bottom: 10px;

            text-transform: uppercase;
        }


        /* CLOCK */

        #clock {

            font-size: 48px;

            font-weight: bold;

            line-height: 1;

            letter-spacing: 2px;

            white-space: nowrap;
        }


        /* DATE */

        #date {

            font-size: 17px;

            margin-top: 10px;

            color: #eeeeee;
        }


        /* WEATHER */

        #weather {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid rgba(255,255,255,0.25);
        }


        /* TEMPERATURE */

        #temperature {

            font-size: 38px;

            font-weight: bold;

            color: #00d9ff;
        }


        /* CONDITION */

        #condition {

            margin-top: 5px;

            font-size: 17px;

            color: white;
        }


        /* HUMIDITY */

        #humidity {

            margin-top: 8px;

            font-size: 14px;

            color: #cccccc;
        }


        /* =========================================
           BOTTOM CENTER INFORMATION BAR
        ========================================= */

        #bottomBar {

            position: fixed;

            left: 50%;

            bottom: 35px;

            transform: translateX(-50%);

            width: min(600px, 55vw);

            padding: 12px 20px;

            background: rgba(0, 10, 25, 0.65);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            border: 1px solid rgba(0, 217, 255, 0.45);

            border-radius: 8px;

            color: white;

            text-align: center;

            z-index: 10;

            box-shadow:
                0 0 20px rgba(0, 180, 255, 0.12);

            box-sizing: border-box;
        }


        /* BAR TEXT */

        .barContent {

            font-size: 13px;

            letter-spacing: 2px;

            white-space: nowrap;
        }


        /* ADC TEXT */

        .barTitle {

            color: #00d9ff;

            font-weight: bold;
        }


        /* DIVIDER */

        .barDivider {

            margin: 0 12px;

            color: rgba(255,255,255,0.4);
        }


        /* TOP / BOTTOM ACCENT LINES */

        .barLine {

            height: 2px;

            width: 35px;

            margin: 0 auto 7px auto;

            background: #00d9ff;
        }


        .barLine:last-child {

            margin: 7px auto 0 auto;
        }


        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-width: 700px) {

            #infoPanel {

                left: 15px;

                width: 210px;

                padding: 18px;
            }


            #clock {

                font-size: 34px;
            }


            #temperature {

                font-size: 28px;
            }


            #location {

                font-size: 12px;
            }


            #date {

                font-size: 13px;
            }


            #condition {

                font-size: 14px;
            }


            #bottomBar {

                bottom: 15px;

                width: 85vw;

                padding: 9px 10px;
            }


            .barContent {

                font-size: 9px;

                letter-spacing: 1px;
            }


            .barDivider {

                margin: 0 5px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         VIDEO PLAYER
    ========================================= -->

    <video
        id="videoPlayer"
        autoplay
        muted
        playsinline
        preload="auto">
    </video>



    <!-- =========================================
         TIME + WEATHER
    ========================================= -->

    <div id="infoPanel">

        <div id="location">
            ABU DHABI
        </div>


        <div id="clock">
            00:00:00
        </div>


        <div id="date">
            Loading date...
        </div>


        <div id="weather">

            <div id="temperature">
                --°C
            </div>


            <div id="condition">
                Loading weather...
            </div>


            <div id="humidity">
                Humidity: --%
            </div>

        </div>

    </div>



    <!-- =========================================
         BOTTOM CENTER BAR
    ========================================= -->

    <div id="bottomBar">

        <div class="barLine"></div>


        <div class="barContent">

            <span class="barTitle">
                ALLIED DATA CENTER
            </span>


            <span class="barDivider">
                |
            </span>


            <span>
                SECURE • RELIABLE • CONNECTED
            </span>

        </div>


        <div class="barLine"></div>

    </div>



    <script>


        /* =========================================
           VIDEO PLAYLIST
        ========================================= */

        const owner = "itallied143";

        const repo = "Allied-DCI";

        const folder = "Video";

        const player =
            document.getElementById("videoPlayer");


        async function loadVideos() {

            try {

                const response = await fetch(

                    `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`

                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load video folder"
                    );

                }


                const files =
                    await response.json();


                const videos = files

                    .filter(file =>
                        file.name
                            .toLowerCase()
                            .endsWith(".mp4")
                    )

                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    )

                    .map(file =>
                        file.download_url
                    );


                if (videos.length === 0) {

                    console.log(
                        "No videos found."
                    );

                    return;
                }


                let currentVideo = 0;


                function playVideo() {

                    player.src =
                        videos[currentVideo];


                    player.play()
                        .catch(error => {

                            console.log(
                                "Autoplay blocked:",
                                error
                            );

                        });

                }


                /* PLAY NEXT VIDEO */

                player.addEventListener(
                    "ended",
                    () => {

                        currentVideo++;


                        /* AFTER LAST VIDEO,
                           START AGAIN */

                        if (
                            currentVideo >=
                            videos.length
                        ) {

                            currentVideo = 0;

                        }


                        playVideo();

                    }
                );


                /* START PLAYING */

                playVideo();


            } catch (error) {

                console.error(
                    "Video error:",
                    error
                );

            }

        }


        loadVideos();



        /* =========================================
           DIGITAL CLOCK
        ========================================= */

        function updateClock() {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit",

                        hour12:
                            false
                    }
                );


            const date =
                now.toLocaleDateString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            document.getElementById(
                "clock"
            ).textContent = time;


            document.getElementById(
                "date"
            ).textContent = date;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );



        /* =========================================
           WEATHER
           ABU DHABI
        ========================================= */

        async function loadWeather() {

            try {

                const response =
                    await fetch(

                        "https://api.open-meteo.com/v1/forecast?latitude=24.4539&longitude=54.3773&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FDubai"

                    );


                if (!response.ok) {

                    throw new Error(
                        "Weather unavailable"
                    );

                }


                const data =
                    await response.json();


                const current =
                    data.current;


                /* TEMPERATURE */

                document.getElementById(
                    "temperature"
                ).textContent =

                    Math.round(
                        current.temperature_2m
                    ) + "°C";



                /* HUMIDITY */

                document.getElementById(
                    "humidity"
                ).textContent =

                    "Humidity: " +

                    Math.round(
                        current.relative_humidity_2m
                    ) +

                    "%";



                /* WEATHER */

                const weatherCode =
                    current.weather_code;


                let condition =
                    "Clear";


                if (weatherCode === 0) {

                    condition =
                        "Clear Sky";

                }

                else if (
                    weatherCode === 1 ||
                    weatherCode === 2
                ) {

                    condition =
                        "Partly Cloudy";

                }

                else if (
                    weatherCode === 3
                ) {

                    condition =
                        "Cloudy";

                }

                else if (
                    weatherCode >= 45 &&
                    weatherCode <= 48
                ) {

                    condition =
                        "Foggy";

                }

                else if (
                    weatherCode >= 51 &&
                    weatherCode <= 67
                ) {

                    condition =
                        "Rain";

                }

                else if (
                    weatherCode >= 71 &&
                    weatherCode <= 77
                ) {

                    condition =
                        "Snow";

                }

                else if (
                    weatherCode >= 80 &&
                    weatherCode <= 82
                ) {

                    condition =
                        "Rain Showers";

                }

                else if (
                    weatherCode >= 95
                ) {

                    condition =
                        "Thunderstorm";

                }


                document.getElementById(
                    "condition"
                ).textContent =
                    condition;


            }

            catch (error) {

                console.log(
                    "Weather error:",
                    error
                );


                document.getElementById(
                    "condition"
                ).textContent =
                    "Weather unavailable";

            }

        }


        /* INITIAL WEATHER */

        loadWeather();


        /* UPDATE EVERY 10 MINUTES */

        setInterval(
            loadWeather,
            600000
        );


    </script>


</body>
</html>
