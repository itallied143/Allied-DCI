<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* =========================================
           PAGE
        ========================================= */

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================
           VIDEO
        ========================================= */

        #videoPlayer {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            object-position: center center;
            margin: 0;
            padding: 0;
            border: 0;
            z-index: 1;
        }


        /* =========================================
           COMBINED TOP INFORMATION BANNER
        ========================================= */

        #topBanner {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: min(94vw, 1180px);
            min-height: 88px;
            padding: 12px 20px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;

            background: rgba(8, 18, 32, 0.60);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(0, 217, 255, 0.30);
            border-radius: 18px;

            color: white;
            z-index: 9999;

            box-shadow:
                0 0 30px rgba(0, 180, 255, 0.16),
                0 8px 30px rgba(0, 0, 0, 0.40);

            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        #topBanner.hudHidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .topSection {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .timeSection {
            flex-direction: column;
            align-items: flex-start;
            flex: 1.25;
        }

        .weatherSection {
            flex: 1;
            gap: 10px;
        }

        .currencySection {
            flex: 1;
            flex-direction: column;
            align-items: center;
        }

        .topDivider {
            width: 1px;
            height: 58px;
            background: rgba(0, 217, 255, 0.25);
            flex-shrink: 0;
        }

        .sectionLabel {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00d9ff;
            white-space: nowrap;
        }

        .liveDot {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin: 0 4px 1px 5px;
            border-radius: 50%;
            background: #00eaff;
            box-shadow: 0 0 8px #00eaff;
        }

        #clock {
            display: flex;
            align-items: baseline;
            margin-top: 3px;
            font-size: 31px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: 2px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.18);
        }

        #clockHour,
        #clockMinute,
        #clockSecond {
            display: inline-block;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }

        .clockColon {
            display: inline-block;
            width: 12px;
            text-align: center;
        }

        #clockPeriod {
            display: inline-block;
            width: 35px;
            margin-left: 5px;
            text-align: left;
            font-size: 0.48em;
            letter-spacing: 1px;
        }

        #date {
            margin-top: 5px;
            font-size: 11px;
            color: rgba(255,255,255,0.65);
            white-space: nowrap;
        }

        .weatherIcon {
            font-size: 34px;
            line-height: 1;
        }

        #temperature {
            font-size: 31px;
            font-weight: 300;
            line-height: 1;
            color: #00d9ff;
            white-space: nowrap;
        }

        .temperatureLabel {
            margin-top: 3px;
            font-size: 8px;
            color: rgba(255,255,255,0.48);
            letter-spacing: 1.5px;
        }

        .weatherDetails {
            text-align: left;
            min-width: 75px;
        }

        #condition {
            font-size: 11px;
            color: white;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        #humidity {
            font-size: 9px;
            color: rgba(255,255,255,0.55);
            white-space: nowrap;
        }

        .currencyViewport {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 210px;
            height: 30px;
            overflow: hidden;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        .currencyItem {
            display: none;
            width: 210px;
            color: white;
            white-space: nowrap;
            text-align: center;
            animation: currencyFade 0.7s ease;
            font-size: 13px;
        }

        .currencyItem.active {
            display: block;
        }

        .currencyItem strong {
            color: #00d9ff;
        }

        .rateValue {
            color: #ffffff;
            margin-left: 3px;
        }

        @keyframes currencyFade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-width: 800px) {
            #topBanner {
                top: 8px;
                width: 96vw;
                min-height: 70px;
                padding: 8px 10px;
                gap: 8px;
                border-radius: 13px;
            }

            .topDivider {
                height: 48px;
            }

            .sectionLabel {
                font-size: 7px;
                letter-spacing: 1px;
            }

            #clock {
                font-size: 23px;
                letter-spacing: 1px;
            }

            #clockHour,
            #clockMinute,
            #clockSecond {
                width: 29px;
            }

            .clockColon {
                width: 7px;
            }

            #clockPeriod {
                width: 28px;
                margin-left: 3px;
            }

            #date {
                font-size: 8px;
            }

            .weatherIcon {
                font-size: 25px;
            }

            #temperature {
                font-size: 24px;
            }

            .weatherDetails {
                min-width: 55px;
            }

            #condition {
                font-size: 8px;
            }

            #humidity {
                font-size: 7px;
            }

            .currencyViewport,
            .currencyItem {
                width: 165px;
            }

            .currencyItem {
                font-size: 9px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         VIDEO PLAYER
    ========================================= -->

    <video
        id="videoPlayer"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        src="http://192.168.0.117/video/ADCVideo.mp4">
    </video>



    <!-- =========================================
         COMBINED TOP INFORMATION BANNER
    ========================================= -->

    <div id="topBanner">

        <div class="topSection timeSection">
            <div class="sectionLabel">ABU DHABI <span class="liveDot"></span> LIVE</div>
            <div id="clock">
                <span id="clockHour">00</span><span class="clockColon">:</span><span id="clockMinute">00</span><span class="clockColon">:</span><span id="clockSecond">00</span>
                <span id="clockPeriod">PM</span>
            </div>
            <div id="date">Loading date...</div>
        </div>

        <div class="topDivider"></div>

        <div class="topSection weatherSection">
            <div class="weatherIcon" id="weatherIcon">☀️</div>
            <div class="weatherMain">
                <div id="temperature">--°C</div>
                <div class="temperatureLabel">TEMPERATURE</div>
            </div>
            <div class="weatherDetails">
                <div id="condition">Loading...</div>
                <div id="humidity">Humidity: --%</div>
            </div>
        </div>

        <div class="topDivider"></div>

        <div class="topSection currencySection">
            <div class="sectionLabel">CURRENCY EXCHANGE</div>

            <div class="currencyViewport">
                <span class="currencyItem active" data-currency="PHP">
                    🇵🇭 PHP <strong>1 AED =</strong> <span id="phpRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="INR">
                    🇮🇳 INR <strong>1 AED =</strong> <span id="inrRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="RSD">
                    🇷🇸 RSD <strong>1 AED =</strong> <span id="rsdRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="JOD">
                    🇯🇴 JOD <strong>1 AED =</strong> <span id="jodRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="EGP">
                    🇪🇬 EGP <strong>1 AED =</strong> <span id="egpRate" class="rateValue">--</span>
                </span>

                <span class="currencyItem" data-currency="MAD">
                    🇲🇦 MAD <strong>1 AED =</strong> <span id="madRate" class="rateValue">--</span>
                </span>
            </div>
        </div>

    </div>


    <script>
        /* =========================================
           LOCAL NETWORK VIDEO PLAYER
           Auto-play + continuous repeat
        ========================================= */

        const player = document.getElementById("videoPlayer");

        const localVideo =
            "http://192.168.0.117/video/ADCVideo.mp4";

        player.src = localVideo;
        player.loop = true;
        player.muted = true;
        player.autoplay = true;
        player.playsInline = true;

        /* Keep HUD visible when the video starts */
        player.addEventListener("play", () => {
            if (typeof showHud === "function") {
                showHud();
            }
        });

        /* Attempt autoplay when the page loads */
        window.addEventListener("load", () => {
            player.play().catch(error => {
                console.log("Autoplay blocked:", error);
            });
        });


        /* =========================================
           CLOCK
        ========================================= */

        function updateClock() {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit",

                        hour12:
                            true
                    }
                );


            const date =
                now.toLocaleDateString(
                    "en-AE",
                    {
                        timeZone:
                            "Asia/Dubai",

                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            const timeParts = time.split(" ");

            const clockParts = timeParts[0].split(":");

            document.getElementById(
                "clockHour"
            ).textContent = clockParts[0];

            document.getElementById(
                "clockMinute"
            ).textContent = clockParts[1];

            document.getElementById(
                "clockSecond"
            ).textContent = clockParts[2];

            document.getElementById(
                "clockPeriod"
            ).textContent = timeParts[1] || "";


            document.getElementById(
                "date"
            ).textContent = date;

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );



        /* =========================================
           WEATHER
           ABU DHABI
        ========================================= */

        async function loadWeather() {

            try {

                const response =
                    await fetch(

                        "https://api.open-meteo.com/v1/forecast?latitude=24.4539&longitude=54.3773&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FDubai"

                    );


                if (!response.ok) {

                    throw new Error(
                        "Weather unavailable"
                    );

                }


                const data =
                    await response.json();


                const current =
                    data.current;


                /* TEMPERATURE */

                document.getElementById(
                    "temperature"
                ).textContent =

                    Math.round(
                        current.temperature_2m
                    ) + "°C";


                /* HUMIDITY */

                document.getElementById(
                    "humidity"
                ).textContent =

                    "Humidity: " +

                    Math.round(
                        current.relative_humidity_2m
                    ) +

                    "%";


                /* WEATHER CONDITION */

                const weatherCode =
                    current.weather_code;


                let condition =
                    "Clear Sky";

                let icon =
                    "☀️";


                if (weatherCode === 0) {

                    condition =
                        "Clear Sky";

                    icon =
                        "☀️";

                }

                else if (
                    weatherCode === 1 ||
                    weatherCode === 2
                ) {

                    condition =
                        "Partly Cloudy";

                    icon =
                        "🌤️";

                }

                else if (
                    weatherCode === 3
                ) {

                    condition =
                        "Cloudy";

                    icon =
                        "☁️";

                }

                else if (
                    weatherCode >= 45 &&
                    weatherCode <= 48
                ) {

                    condition =
                        "Foggy";

                    icon =
                        "🌫️";

                }

                else if (
                    weatherCode >= 51 &&
                    weatherCode <= 67
                ) {

                    condition =
                        "Rain";

                    icon =
                        "🌧️";

                }

                else if (
                    weatherCode >= 80 &&
                    weatherCode <= 82
                ) {

                    condition =
                        "Rain Showers";

                    icon =
                        "🌦️";

                }

                else if (
                    weatherCode >= 95
                ) {

                    condition =
                        "Thunderstorm";

                    icon =
                        "⛈️";

                }


                document.getElementById(
                    "condition"
                ).textContent =
                    condition;


                document.getElementById(
                    "weatherIcon"
                ).textContent =
                    icon;


            }

            catch (error) {

                console.log(
                    "Weather error:",
                    error
                );


                document.getElementById(
                    "condition"
                ).textContent =
                    "Weather unavailable";

            }

        }


        /* INITIAL WEATHER */

        loadWeather();


        /* REFRESH EVERY 10 MINUTES */

        setInterval(
            loadWeather,
            600000
        );



        /* =========================================
           LIVE AED CURRENCY EXCHANGE
           PHP = Philippine Peso
           INR = Indian Rupee
           RSD = Serbian Dinar
           JOD = Jordanian Dinar
           EGP = Egyptian Pound
           MAD = Moroccan Dirham
        ========================================= */

        async function loadCurrencyRates() {

            try {

                const response = await fetch(
                    "https://open.er-api.com/v6/latest/AED"
                );

                if (!response.ok) {
                    throw new Error("Currency rates unavailable");
                }

                const data = await response.json();
                const rates = data.rates;

                document.getElementById("phpRate").textContent =
                    rates.PHP ? rates.PHP.toFixed(2) : "--";

                document.getElementById("inrRate").textContent =
                    rates.INR ? rates.INR.toFixed(2) : "--";

                document.getElementById("rsdRate").textContent =
                    rates.RSD ? rates.RSD.toFixed(2) : "--";

                document.getElementById("jodRate").textContent =
                    rates.JOD ? rates.JOD.toFixed(2) : "--";

                document.getElementById("egpRate").textContent =
                    rates.EGP ? rates.EGP.toFixed(2) : "--";

                document.getElementById("madRate").textContent =
                    rates.MAD ? rates.MAD.toFixed(2) : "--";


            } catch (error) {

                console.log("Currency error:", error);

            }

        }

        loadCurrencyRates();

        /* Refresh exchange rates every 30 minutes */
        setInterval(
            loadCurrencyRates,
            1800000
        );


        /* =========================================
           CHANGE CURRENCY EVERY 4 SECONDS
        ========================================= */

        const currencyItems =
            document.querySelectorAll(".currencyItem");

        let currencyIndex = 0;

        function rotateCurrency() {

            currencyItems.forEach(item =>
                item.classList.remove("active")
            );

            currencyIndex++;

            if (currencyIndex >= currencyItems.length) {
                currencyIndex = 0;
            }

            currencyItems[currencyIndex]
                .classList.add("active");
        }

        setInterval(
            rotateCurrency,
            4000
        );

    </script>


</body>
</html>
