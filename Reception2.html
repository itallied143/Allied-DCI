<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* VIDEO */
        #videoPlayer {
            display: block;
            width: 100%;
            height: 100vh;
            object-fit: contain;
            margin: 0;
            padding: 0;
            border: 0;
        }

        /* LEFT INFORMATION PANEL */
        #infoPanel {
            position: fixed;
            left: 35px;
            top: 50%;
            transform: translateY(-50%);

            width: 260px;
            padding: 25px 28px;

            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-left: 4px solid #00d9ff;
            border-radius: 0 15px 15px 0;

            color: white;
            z-index: 10;

            box-sizing: border-box;
        }

        /* LOCATION */
        #location {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00d9ff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* CLOCK */
        #clock {
            font-size: 48px;
            font-weight: bold;
            line-height: 1;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* DATE */
        #date {
            font-size: 17px;
            margin-top: 10px;
            color: #eeeeee;
        }

        /* WEATHER */
        #weather {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.25);
        }

        #temperature {
            font-size: 38px;
            font-weight: bold;
            color: #00d9ff;
        }

        #condition {
            margin-top: 5px;
            font-size: 17px;
            color: white;
        }

        #humidity {
            margin-top: 8px;
            font-size: 14px;
            color: #cccccc;
        }

        /* MOBILE / SMALL SCREEN */
        @media (max-width: 700px) {

            #infoPanel {
                left: 15px;
                width: 210px;
                padding: 18px;
            }

            #clock {
                font-size: 34px;
            }

            #temperature {
                font-size: 28px;
            }

            #location {
                font-size: 12px;
            }

            #date {
                font-size: 13px;
            }

            #condition {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- VIDEO PLAYER -->
    <video
        id="videoPlayer"
        autoplay
        muted
        playsinline
        preload="auto">
    </video>


    <!-- TIME + WEATHER -->
    <div id="infoPanel">

        <div id="location">
            ABU DHABI
        </div>

        <div id="clock">
            00:00:00
        </div>

        <div id="date">
            Loading date...
        </div>

        <div id="weather">

            <div id="temperature">
                --°C
            </div>

            <div id="condition">
                Loading weather...
            </div>

            <div id="humidity">
                Humidity: --%
            </div>

        </div>

    </div>


    <script>

        /* =========================================
           VIDEO PLAYLIST
        ========================================= */

        const owner = "itallied143";
        const repo = "Allied-DCI";
        const folder = "Video";

        const player = document.getElementById("videoPlayer");


        async function loadVideos() {

            try {

                const response = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
                );

                if (!response.ok) {
                    throw new Error("Could not load video folder");
                }

                const files = await response.json();

                const videos = files
                    .filter(file =>
                        file.name.toLowerCase().endsWith(".mp4")
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    )
                    .map(file => file.download_url);


                if (videos.length === 0) {
                    console.log("No videos found.");
                    return;
                }


                let currentVideo = 0;


                function playVideo() {

                    player.src = videos[currentVideo];

                    player.play().catch(error => {
                        console.log("Autoplay blocked:", error);
                    });

                }


                /* PLAY NEXT VIDEO */

                player.addEventListener("ended", () => {

                    currentVideo++;

                    if (currentVideo >= videos.length) {
                        currentVideo = 0;
                    }

                    playVideo();

                });


                /* START */

                playVideo();


            } catch (error) {

                console.error("Video error:", error);

            }

        }


        loadVideos();



        /* =========================================
           DIGITAL CLOCK
        ========================================= */

        function updateClock() {

            const now = new Date();


            const time = now.toLocaleTimeString("en-AE", {
                timeZone: "Asia/Dubai",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });


            const date = now.toLocaleDateString("en-AE", {
                timeZone: "Asia/Dubai",
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            });


            document.getElementById("clock").textContent = time;

            document.getElementById("date").textContent = date;

        }


        updateClock();

        setInterval(updateClock, 1000);



        /* =========================================
           WEATHER
           ABU DHABI
        ========================================= */

        async function loadWeather() {

            try {

                /*
                    Abu Dhabi coordinates
                    Latitude: 24.4539
                    Longitude: 54.3773
                */

                const response = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=24.4539&longitude=54.3773&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FDubai"
                );


                if (!response.ok) {
                    throw new Error("Weather unavailable");
                }


                const data = await response.json();

                const current = data.current;


                /* TEMPERATURE */

                document.getElementById("temperature").textContent =
                    Math.round(current.temperature_2m) + "°C";


                /* HUMIDITY */

                document.getElementById("humidity").textContent =
                    "Humidity: " +
                    Math.round(current.relative_humidity_2m) +
                    "%";


                /* WEATHER CONDITION */

                const weatherCode = current.weather_code;

                let condition = "Clear";


                if (weatherCode === 0) {
                    condition = "Clear Sky";
                }
                else if (
                    weatherCode === 1 ||
                    weatherCode === 2
                ) {
                    condition = "Partly Cloudy";
                }
                else if (weatherCode === 3) {
                    condition = "Cloudy";
                }
                else if (
                    weatherCode >= 45 &&
                    weatherCode <= 48
                ) {
                    condition = "Foggy";
                }
                else if (
                    weatherCode >= 51 &&
                    weatherCode <= 67
                ) {
                    condition = "Rain";
                }
                else if (
                    weatherCode >= 71 &&
                    weatherCode <= 77
                ) {
                    condition = "Snow";
                }
                else if (
                    weatherCode >= 80 &&
                    weatherCode <= 82
                ) {
                    condition = "Rain Showers";
                }
                else if (
                    weatherCode >= 95
                ) {
                    condition = "Thunderstorm";
                }


                document.getElementById("condition").textContent =
                    condition;


            } catch (error) {

                console.log("Weather error:", error);

                document.getElementById("condition").textContent =
                    "Weather unavailable";

            }

        }


        loadWeather();


        /* UPDATE WEATHER EVERY 10 MINUTES */

        setInterval(loadWeather, 600000);

    </script>

</body>
</html>
