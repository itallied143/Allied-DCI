<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADC Live Clock</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .clock-container {
        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background: transparent;
        text-align: center;
    }

    /* BIG TIME */
    #time {
        font-size: clamp(80px, 20vw, 260px);
        font-weight: 800;
        color: #0b2b55;

        line-height: 0.9;
        letter-spacing: 2px;

        white-space: nowrap;
    }

    /* DATE */
    #date {
        margin-top: 30px;

        font-size: clamp(18px, 3.5vw, 42px);
        font-weight: 600;

        color: #1689d8;

        letter-spacing: 4px;
        text-transform: uppercase;

        white-space: nowrap;
    }

    /* BLUE / TEAL LINE */
    .line {
        width: 140px;
        height: 5px;

        margin-top: 22px;

        background: linear-gradient(
            90deg,
            #00d7b5,
            #008cff,
            #124de3
        );

        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="clock-container">

    <div id="time">00:00:00 AM</div>

    <div id="date">
        TUESDAY, SEPTEMBER 29, 2026
    </div>

    <div class="line"></div>

</div>

<script>

function updateClock() {

    const now = new Date();

    // UAE / Abu Dhabi time
    const time = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Dubai",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    }).format(now);

    const date = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Dubai",
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    }).format(now);

    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
